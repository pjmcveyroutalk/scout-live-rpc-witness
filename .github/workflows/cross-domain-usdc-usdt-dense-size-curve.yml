name: Cross-Domain USDC-USDT Dense Size Curve

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-size-curve:
    name: 250-500-750-1000-1500-2000 USDC read-only curve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout witness repository
        uses: actions/checkout@v4
      - name: Capture Solana dense size curve
        run: python3 dense_size_curve_solana_usdc_usdt.py
      - name: Capture Arbitrum dense size curve
        run: python3 dense_size_curve_arbitrum_usdc_usdt.py
      - name: Package exact evidence bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf cross-domain-dense-size-curve-evidence.tgz live-evidence
          sha256sum cross-domain-dense-size-curve-evidence.tgz > cross-domain-dense-size-curve-evidence.tgz.sha256
      - name: Upload dense size-curve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-domain-usdc-usdt-dense-size-curve-${{ github.run_id }}
          path: |
            live-evidence/
            cross-domain-dense-size-curve-evidence.tgz
            cross-domain-dense-size-curve-evidence.tgz.sha256
          if-no-files-found: error
          retention-days: 30


