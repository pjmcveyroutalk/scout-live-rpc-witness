name: Cross-Chain Multi-Asset Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Solana-Arbitrum live multi-asset scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scan live cross-chain quote candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, http.client, json, ssl, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode, urlparse

          USDC_SOL="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          USDC_ARB="0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
          ASSETS=[
            {"symbol":"USDT","sol":"Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB","arb":"0xfd086bc7cd5c481dcc9c85ebe478a1c0b69fcbb9","sd":6,"ad":6},
            {"symbol":"ETH","sol":"7vfCXTUXx5WJV5JADk17DUJ4ksgau7utNKj4b963voxs","arb":"0x82af49447d8a07e3bd95bd0d56f35241523fbab1","sd":8,"ad":18},
            {"symbol":"WBTC","sol":"3NZ9JMVBmGaG4Q8pf8WhTg8tQV7Ng8HmK8ZgYDBpqmJh","arb":"0x2f2a2543B76A4166549F7aaB2e75Bef0aefC5B0f","sd":8,"ad":8},
          ]
          NOTIONALS=[100,500]
          RAY="transaction-v1.raydium.io"
          PARA="api.paraswap.io"
          SOL_RPC="https://api.mainnet-beta.solana.com"
          ARB_RPC="https://arb1.arbitrum.io/rpc"

          def now():
            return datetime.now(timezone.utc).isoformat(timespec="microseconds").replace("+00:00","Z")
          def sha(b): return hashlib.sha256(b).hexdigest()

          def req(host, method, target, body=b"", ctype=None):
            headers=[("Host",host),("User-Agent","Scout-XChain-Scanner/1.0.0"),("Accept","application/json"),("Accept-Encoding","identity"),("Cache-Control","no-cache"),("Connection","close")]
            if ctype: headers.append(("Content-Type",ctype))
            if body: headers.append(("Content-Length",str(len(body))))
            rb=(f"{method} {target} HTTP/1.1\r\n"+"".join(f"{k}: {v}\r\n" for k,v in headers)+"\r\n").encode()+body
            t0=now(); m0=time.monotonic_ns()
            c=http.client.HTTPSConnection(host,443,timeout=30,context=ssl.create_default_context())
            try:
              c.putrequest(method,target,skip_host=True,skip_accept_encoding=True)
              for k,v in headers: c.putheader(k,v)
              c.endheaders(body if body else None)
              r=c.getresponse(); raw=r.read(); status=r.status
            finally: c.close()
            try: js=json.loads(raw.decode())
            except Exception: js={"raw_utf8":raw.decode(errors="replace")}
            return {"started":t0,"completed":now(),"duration_ms":round((time.monotonic_ns()-m0)/1e6,3),"http_status":status,"request_bytes":rb,"response_bytes":raw,"request_sha256":sha(rb),"response_sha256":sha(raw),"json":js}

          def rpc(url,method,params,rid):
            p=urlparse(url)
            body=json.dumps({"jsonrpc":"2.0","id":rid,"method":method,"params":params},separators=(",",":")).encode()
            return req(p.netloc,"POST",p.path or "/",body,"application/json")

          def ray(src,dst,amt):
            q="/compute/swap-base-in?"+urlencode([("inputMint",src),("outputMint",dst),("amount",str(amt)),("slippageBps","50"),("txVersion","V0")])
            r=req(RAY,"GET",q)
            d=r["json"].get("data") if isinstance(r["json"],dict) else None
            r["ok"]=bool(r["http_status"]==200 and isinstance(r["json"],dict) and r["json"].get("success") is True and isinstance(d,dict) and str(d.get("outputAmount","")).isdigit())
            if r["ok"]: r["out"]=int(d["outputAmount"])
            return r

          def para(src,dst,amt,sd,dd):
            q="/prices?"+urlencode([("srcToken",src),("destToken",dst),("amount",str(amt)),("srcDecimals",str(sd)),("destDecimals",str(dd)),("side","SELL"),("network","42161")])
            r=req(PARA,"GET",q)
            pr=r["json"].get("priceRoute") if isinstance(r["json"],dict) else None
            r["ok"]=bool(r["http_status"]==200 and isinstance(pr,dict) and str(pr.get("destAmount","")).isdigit())
            if r["ok"]:
              r["out"]=int(pr["destAmount"]); r["gas_usd"]=pr.get("gasCostUSD")
            return r

          def convert(n,fd,td):
            return n*(10**(td-fd)) if td>=fd else n//(10**(fd-td))
          def fg(x):
            try: return float(x)
            except: return None

          root=Path("multiasset-scan-evidence"); root.mkdir()
          records={}
          def keep(name,r):
            records[name]=r
            (root/f"{name}_request.http").write_bytes(r["request_bytes"])
            (root/f"{name}_response.body").write_bytes(r["response_bytes"])

          sol=rpc(SOL_RPC,"getSlot",[{"commitment":"finalized"}],1); keep("solana_getSlot",sol)
          ab=rpc(ARB_RPC,"eth_blockNumber",[],2); keep("arbitrum_eth_blockNumber",ab)
          ag=rpc(ARB_RPC,"eth_gasPrice",[],3); keep("arbitrum_eth_gasPrice",ag)

          obs=[]
          for a in ASSETS:
            for dollars in NOTIONALS:
              base=dollars*1_000_000
              row={"asset":a["symbol"],"notional_usdc":dollars,"directions":{}}
              tag=f"{a['symbol'].lower()}_{dollars}"

              sb=ray(USDC_SOL,a["sol"],base); keep(tag+"_a_sol_buy",sb)
              if sb["ok"]:
                aset=para(a["arb"],USDC_ARB,convert(sb["out"],a["sd"],a["ad"]),a["ad"],6); keep(tag+"_a_arb_sell",aset)
                if aset["ok"]:
                  delta=(aset["out"]-base)/1e6; gas=fg(aset.get("gas_usd")); gadj=None if gas is None else delta-gas
                  row["directions"]["solana_to_arbitrum"]={"status":"quoted","gross_delta_usd":delta,"gross_bps":delta*10000/dollars,"arb_gas_usd":gas,"gas_adjusted_usd":gadj,"gas_adjusted_bps":None if gadj is None else gadj*10000/dollars,"partial_positive":bool(gadj is not None and gadj>0)}
                else: row["directions"]["solana_to_arbitrum"]={"status":"arbitrum_quote_failed"}
              else: row["directions"]["solana_to_arbitrum"]={"status":"solana_quote_failed"}

              abuy=para(USDC_ARB,a["arb"],base,6,a["ad"]); keep(tag+"_b_arb_buy",abuy)
              if abuy["ok"]:
                ss=ray(a["sol"],USDC_SOL,convert(abuy["out"],a["ad"],a["sd"])); keep(tag+"_b_sol_sell",ss)
                if ss["ok"]:
                  delta=(ss["out"]-base)/1e6; gas=fg(abuy.get("gas_usd")); gadj=None if gas is None else delta-gas
                  row["directions"]["arbitrum_to_solana"]={"status":"quoted","gross_delta_usd":delta,"gross_bps":delta*10000/dollars,"arb_gas_usd":gas,"gas_adjusted_usd":gadj,"gas_adjusted_bps":None if gadj is None else gadj*10000/dollars,"partial_positive":bool(gadj is not None and gadj>0)}
                else: row["directions"]["arbitrum_to_solana"]={"status":"solana_quote_failed"}
              else: row["directions"]["arbitrum_to_solana"]={"status":"arbitrum_quote_failed"}

              obs.append(row)

          ranked=[]
          for row in obs:
            for direction,r in row["directions"].items():
              if r.get("status")=="quoted":
                ranked.append({"asset":row["asset"],"notional_usdc":row["notional_usdc"],"direction":direction,**r})
          ranked.sort(key=lambda x: -1e99 if x["gas_adjusted_bps"] is None else x["gas_adjusted_bps"], reverse=True)

          evidence={
            "schema":"scout.crosschain_multiasset_scan.v1",
            "observation_only":True,
            "execution_authority":False,
            "chains":["solana-mainnet","arbitrum-one"],
            "assets":[a["symbol"] for a in ASSETS],
            "notionals_usdc":NOTIONALS,
            "chain_state":{"solana_finalized_slot":sol["json"].get("result"),"arbitrum_block_number_hex":ab["json"].get("result"),"arbitrum_gas_price_wei_hex":ag["json"].get("result")},
            "observations":obs,
            "ranking_by_gas_adjusted_bps":ranked,
            "candidate_count_after_partial_cost_screen":sum(1 for x in ranked if x["partial_positive"]),
            "important_limit":"Partial screen only: subtracts Arbitrum quote gas estimate, but not Solana fees, realized slippage, inventory/rebalancing, representation/basis risk, or timing/finality risk. Positive means research candidate only.",
            "evidence_hashes":{n:{"started_at_utc":r["started"],"completed_at_utc":r["completed"],"http_status":r["http_status"],"request_sha256":r["request_sha256"],"response_sha256":r["response_sha256"]} for n,r in records.items()},
            "safety":{"wallet":False,"private_key":False,"seed_phrase":False,"signer":False,"transaction_builder":False,"transaction_signing":False,"transaction_submission":False,"broadcast":False,"bridge_execution":False,"capital_movement":False}
          }
          (root/"evidence.json").write_text(json.dumps(evidence,sort_keys=True,indent=2)+"\n")
          manifest=[]
          for p in sorted(root.iterdir()):
            if p.is_file() and p.name!="manifest.sha256":
              manifest.append(f"{sha(p.read_bytes())}  {p.name}")
          (root/"manifest.sha256").write_text("\n".join(manifest)+"\n")
          print(json.dumps({"candidate_count_after_partial_cost_screen":evidence["candidate_count_after_partial_cost_screen"],"ranking_by_gas_adjusted_bps":ranked,"execution_authority":False},indent=2))
          PY

      - name: Upload scanner evidence
        uses: actions/upload-artifact@v4
        with:
          name: crosschain-multiasset-scan-${{ github.run_id }}
          path: multiasset-scan-evidence/
          if-no-files-found: error
          retention-days: 30
