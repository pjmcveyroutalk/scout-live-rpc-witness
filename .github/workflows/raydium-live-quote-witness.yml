name: Raydium Live Quote Witness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-1:
    name: QUOTE-1 read-only capture
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout witness repository
        uses: actions/checkout@v4

      - name: Show Python runtime
        run: python3 --version

      - name: Capture genuine Raydium quote
        run: python3 raydium_quote_witness.py capture --output live-evidence

      - name: Package exact evidence bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf raydium-live-quote-evidence.tgz live-evidence
          sha256sum raydium-live-quote-evidence.tgz > raydium-live-quote-evidence.tgz.sha256

      - name: Upload QUOTE-1 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raydium-live-quote-evidence-${{ github.run_id }}
          path: |
            live-evidence/
            raydium-live-quote-evidence.tgz
            raydium-live-quote-evidence.tgz.sha256
          if-no-files-found: error
          retention-days: 30

