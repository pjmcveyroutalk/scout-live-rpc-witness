name: Scout Live Slippage Measurement

on:
  workflow_dispatch:
    inputs:
      transaction_signature:
        description: "Finalized Solana transaction signature"
        required: true
        type: string
      wallet_owner:
        description: "Public wallet owner address"
        required: true
        type: string
      quoted_output_base_units:
        description: "Exact decision-quote output amount in token base units"
        required: true
        type: string
      decision_quote_timestamp_utc:
        description: "Exact decision quote UTC timestamp"
        required: true
        type: string
      quote_request_sha256:
        description: "SHA-256 of exact quote request"
        required: true
        type: string
      quote_response_sha256:
        description: "SHA-256 of exact quote response"
        required: true
        type: string
      output_mint:
        description: "Output token mint"
        required: true
        default: "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"
        type: string

permissions:
  contents: read

jobs:
  measure:
    name: Read-only finalized settlement measurement
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout witness repository
        uses: actions/checkout@v4

      - name: Measure realized slippage from finalized public evidence
        shell: bash
        env:
          TX_SIGNATURE: ${{ inputs.transaction_signature }}
          WALLET_OWNER: ${{ inputs.wallet_owner }}
          QUOTED_OUTPUT: ${{ inputs.quoted_output_base_units }}
          QUOTE_TIMESTAMP: ${{ inputs.decision_quote_timestamp_utc }}
          QUOTE_REQUEST_SHA: ${{ inputs.quote_request_sha256 }}
          QUOTE_RESPONSE_SHA: ${{ inputs.quote_response_sha256 }}
          OUTPUT_MINT: ${{ inputs.output_mint }}
        run: |
          set -euo pipefail
          python3 live_slippage_settlement_verifier.py \
            --signature "$TX_SIGNATURE" \
            --wallet-owner "$WALLET_OWNER" \
            --quoted-output-base-units "$QUOTED_OUTPUT" \
            --decision-quote-timestamp-utc "$QUOTE_TIMESTAMP" \
            --quote-request-sha256 "$QUOTE_REQUEST_SHA" \
            --quote-response-sha256 "$QUOTE_RESPONSE_SHA" \
            --output-mint "$OUTPUT_MINT"

      - name: Build run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Scout Live Slippage Measurement"
            echo
            echo "- Witness execution authority: **false**"
            echo "- Transaction construction/signing/submission: **not performed by this workflow**"
            echo "- Evidence source: finalized public Solana RPC transaction metadata"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf live-slippage-evidence.tgz live-evidence
          sha256sum live-slippage-evidence.tgz > live-slippage-evidence.tgz.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-live-slippage-${{ github.run_id }}
          path: |
            live-evidence/
            live-slippage-evidence.tgz
            live-slippage-evidence.tgz.sha256
          if-no-files-found: error
          retention-days: 30

